name: Release RTT

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: Space or comma separated OpenClaw versions to measure
        required: false
        default: ""
        type: string
      rss_backfill:
        description: Backfill RSS onto existing release rows without changing RTT values
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      rss_backfill_limit:
        description: Maximum existing release versions to backfill in this run
        required: false
        default: "4"
        type: string
      rss_backfill_skip_versions:
        description: Space or comma separated release versions to skip during RSS backfill
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.rss_backfill == 'true' && 'rtt-report-writer-main' || format('release-rtt-{0}', github.ref) }}
  queue: max
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26.12.1"
  PNPM_VERSION: "12.15.0"
  pnpm_config_pm_on_fail: "ignore"

jobs:
  measure:
    name: Measure OpenClaw release RTT
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      artifact_id: ${{ steps.upload_import.outputs.artifact-id }}
    steps:
      - name: Checkout RTT tracker
        uses: actions/checkout@v7
        with:
          path: openclaw-rtt
          fetch-depth: 0

      - name: Archive workflow scripts
        working-directory: openclaw-rtt
        shell: bash
        run: |
          set -euo pipefail
          scripts_archive_dir="$(mktemp -d "$RUNNER_TEMP/rtt-workflow-scripts.XXXXXX")"
          git archive "${{ github.workflow_sha }}" scripts | tar -x -C "$scripts_archive_dir"
          printf 'RTT_SCRIPTS_DIR=%s\n' "$scripts_archive_dir/scripts" >>"$GITHUB_ENV"

      - name: Setup Node and pnpm
        uses: pnpm/setup@v3.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false

      - name: Resolve OpenClaw packages
        id: release
        working-directory: openclaw-rtt
        env:
          INPUT_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.versions || '' }}
          INPUT_RSS_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.rss_backfill || 'false' }}
          INPUT_RSS_BACKFILL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.rss_backfill_limit || '' }}
          INPUT_RSS_BACKFILL_SKIP_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.rss_backfill_skip_versions || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-openclaw-package.mjs

      - name: Checkout OpenClaw harness
        if: steps.release.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: main
          path: openclaw
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Blacksmith Docker Builder
        if: steps.release.outputs.should_run == 'true'
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2
        with:
          cache-key: openclaw-rtt-release-telegram

      - name: Locate pnpm store
        if: steps.release.outputs.should_run == 'true'
        id: pnpm-store
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          store_path="$(pnpm store path --silent)"
          test -n "$store_path"
          printf 'path=%s\n' "$store_path" >>"$GITHUB_OUTPUT"

      - name: Restore pnpm store
        if: steps.release.outputs.should_run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: openclaw-release-rtt-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openclaw/pnpm-lock.yaml') }}
          restore-keys: |
            openclaw-release-rtt-pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install OpenClaw harness dependencies
        if: steps.release.outputs.should_run == 'true'
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          time pnpm install --frozen-lockfile --prefer-offline --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Build OpenClaw QA harness
        if: steps.release.outputs.should_run == 'true'
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          time OPENCLAW_BUILD_PRIVATE_QA=1 pnpm build

      - name: Run RSS backfill
        if: steps.release.outputs.should_run == 'true' && steps.release.outputs.rss_backfill == 'true'
        working-directory: openclaw
        env:
          OPENCLAW_ALLOW_OLDER_BINARY_DESTRUCTIVE_ACTIONS: "1"
          OPENCLAW_QA_CREDENTIAL_SOURCE: convex
          OPENCLAW_QA_CREDENTIAL_ROLE: ci
          OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
          OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
          OPENCLAW_NPM_TELEGRAM_SKIP_HOTPATH: "1"
        shell: bash
        run: |
          set -euo pipefail
          read -r -a specs <<< "${{ steps.release.outputs.specs }}"
          read -r -a versions <<< "${{ steps.release.outputs.versions }}"
          for index in "${!specs[@]}"; do
            spec="${specs[$index]}"
            version="${versions[$index]}"
            output="$RUNNER_TEMP/openclaw-rtt-runs/$(printf '%s' "$spec" | tr -c 'A-Za-z0-9._-' '_')"
            metrics_path="${output}/resource-metrics.env"
            mkdir -p "$output"
            set +e
            OPENCLAW_NPM_TELEGRAM_PACKAGE_SPEC="$spec" \
            OPENCLAW_NPM_TELEGRAM_OUTPUT_DIR="$output/raw" \
            OPENCLAW_NPM_TELEGRAM_PROVIDER_MODE=mock-openai \
            OPENCLAW_NPM_TELEGRAM_RTT_CHECKS=telegram-reply-chain-exact-marker \
            OPENCLAW_NPM_TELEGRAM_RTT_SAMPLES=20 \
            OPENCLAW_QA_TELEGRAM_SCENARIO_TIMEOUT_MS=240000 \
              /usr/bin/time \
              -f 'max_rss_kb=%M\nelapsed_seconds=%e' \
              -o "$metrics_path" \
              timeout --kill-after=30s 10m \
              pnpm test:docker:npm-telegram-live
            status="$?"
            set -e
            echo "exit_status=${status}" >>"$metrics_path"
            evidence_path="$output/raw/qa-evidence.json"
            if [[ ! -f "$evidence_path" ]]; then
              echo "Skipping RSS backfill for $spec because the rerun did not produce qa-evidence.json." >&2
              continue
            fi
            run_status="$(node -e 'const fs = require("node:fs"); const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const failed = !Array.isArray(evidence.entries) || evidence.entries.some((entry) => entry?.result?.status !== "pass"); process.stdout.write(failed ? "fail" : "pass");' "$evidence_path")"
            if [[ "$run_status" != "pass" ]]; then
              echo "Skipping RSS backfill for failed rerun ${evidence_path} (status=${run_status:-missing})." >&2
              continue
            fi
            (
              cd ../openclaw-rtt
              node "$RTT_SCRIPTS_DIR/publish-rtt-report.mjs" prepare
              node "$RTT_SCRIPTS_DIR/backfill-release-rss.mjs" \
                --family telegram \
                --spec "$spec" \
                --version "$version" \
                --resource-metrics "$metrics_path"
              node "$RTT_SCRIPTS_DIR/update-readme.mjs"
              node "$RTT_SCRIPTS_DIR/validate.mjs"
              node "$RTT_SCRIPTS_DIR/publish-rtt-report.mjs" publish --family telegram --key "$version"
            )
          done

      - name: Run RTT
        if: steps.release.outputs.should_run == 'true' && steps.release.outputs.rss_backfill != 'true'
        id: rtt
        working-directory: openclaw
        env:
          OPENCLAW_ALLOW_OLDER_BINARY_DESTRUCTIVE_ACTIONS: "1"
          OPENCLAW_QA_CREDENTIAL_SOURCE: convex
          OPENCLAW_QA_CREDENTIAL_ROLE: ci
          OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
          OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
          OPENCLAW_NPM_TELEGRAM_SKIP_HOTPATH: "1"
        shell: bash
        run: |
          set -euo pipefail
          result_paths="$RUNNER_TEMP/openclaw-rtt-result-paths.txt"
          : >"$result_paths"
          read -r -a specs <<< "${{ steps.release.outputs.specs }}"
          read -r -a versions <<< "${{ steps.release.outputs.versions }}"
          for index in "${!specs[@]}"; do
            spec="${specs[$index]}"
            version="${versions[$index]}"
            output="$RUNNER_TEMP/openclaw-rtt-runs/$(printf '%s' "$spec" | tr -c 'A-Za-z0-9._-' '_')"
            metrics_path="${output}/resource-metrics.env"
            mkdir -p "$output"
            started_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            set +e
            OPENCLAW_NPM_TELEGRAM_PACKAGE_SPEC="$spec" \
            OPENCLAW_NPM_TELEGRAM_OUTPUT_DIR="$output/raw" \
            OPENCLAW_NPM_TELEGRAM_PROVIDER_MODE=mock-openai \
            OPENCLAW_NPM_TELEGRAM_RTT_CHECKS=telegram-reply-chain-exact-marker \
            OPENCLAW_NPM_TELEGRAM_RTT_SAMPLES=20 \
            OPENCLAW_QA_TELEGRAM_SCENARIO_TIMEOUT_MS=240000 \
              /usr/bin/time \
              -f 'max_rss_kb=%M\nelapsed_seconds=%e' \
              -o "$metrics_path" \
              pnpm test:docker:npm-telegram-live
            status="$?"
            set -e
            finished_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            echo "exit_status=${status}" >>"$metrics_path"
            evidence_path="$output/raw/qa-evidence.json"
            if [[ ! -f "$evidence_path" ]]; then
              echo "No qa-evidence.json produced for $spec." >&2
              if [[ "${{ steps.release.outputs.rss_backfill }}" == "true" ]]; then
                echo "Skipping RSS backfill for $spec because the rerun did not produce qa-evidence.json." >&2
                continue
              fi
              if [[ "$status" -eq 0 ]]; then
                status=1
              fi
              exit "$status"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$evidence_path" "$metrics_path" "$version" "$started_at" "$finished_at" >>"$result_paths"
          done
          echo "result_paths=$result_paths" >>"$GITHUB_OUTPUT"

      - name: Verify OpenClaw checkout is clean
        if: always() && steps.release.outputs.should_run == 'true'
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "OpenClaw checkout was modified by the Telegram RTT harness." >&2
            exit 1
          fi

      - name: Prepare release import artifact
        if: steps.release.outputs.should_run == 'true' && steps.release.outputs.rss_backfill != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/rtt-import"
          mkdir -p "$bundle"
          index=0
          while IFS=$'\t' read -r evidence_path metrics_path version started_at finished_at; do
            index=$((index + 1))
            mkdir -p "$bundle/$index"
            cp "$evidence_path" "$bundle/$index/evidence.json"
            cp "$metrics_path" "$bundle/$index/metrics.env"
            printf '%s\t%s\t%s\t%s\n' "$index" "$version" "$started_at" "$finished_at" >>"$bundle/metadata.tsv"
          done <"${{ steps.rtt.outputs.result_paths }}"

      - name: Upload release import artifact
        if: steps.release.outputs.should_run == 'true' && steps.release.outputs.rss_backfill != 'true'
        id: upload_import
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-telegram-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rtt-import
          if-no-files-found: error
          retention-days: 14

      - name: Report skipped package
        if: steps.release.outputs.should_run != 'true'
        run: |
          echo "No new release versions to measure after ${{ steps.release.outputs.anchor }} (${{ steps.release.outputs.reason }})"

  report:
    name: Import release Telegram RTT report
    needs: measure
    if: github.ref == 'refs/heads/main' && needs.measure.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      group: rtt-report-writer-main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout RTT tracker
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Archive workflow scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts_archive_dir="$(mktemp -d "$RUNNER_TEMP/rtt-workflow-scripts.XXXXXX")"
          git archive "${{ github.workflow_sha }}" scripts | tar -x -C "$scripts_archive_dir"
          printf 'RTT_SCRIPTS_DIR=%s\n' "$scripts_archive_dir/scripts" >>"$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download exact RTT import artifact
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.measure.outputs.artifact_id }}
          path: ${{ runner.temp }}/rtt-import
          merge-multiple: true

      - name: Import result
        shell: bash
        run: |
          set -euo pipefail
          node "$RTT_SCRIPTS_DIR/publish-rtt-report.mjs" prepare
          while IFS=$'\t' read -r index version started_at finished_at; do
            node "$RTT_SCRIPTS_DIR/import-result.mjs" "$RUNNER_TEMP/rtt-import/$index/evidence.json" \
              --version "$version" \
              --scenario telegram-reply-chain-exact-marker \
              --started-at "$started_at" --finished-at "$finished_at" \
              --resource-metrics "$RUNNER_TEMP/rtt-import/$index/metrics.env"
          done <"$RUNNER_TEMP/rtt-import/metadata.tsv"
          node "$RTT_SCRIPTS_DIR/update-readme.mjs"
          node "$RTT_SCRIPTS_DIR/validate.mjs"
          node "$RTT_SCRIPTS_DIR/summary.mjs"

      - name: Commit result
        run: node "$RTT_SCRIPTS_DIR/publish-rtt-report.mjs" publish --family telegram
