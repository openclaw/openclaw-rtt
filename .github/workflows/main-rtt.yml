name: Main RTT

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: Number of Telegram RTT samples
        required: false
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: main-rtt-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26.x"
  PNPM_VERSION: "12.1.0"
  PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS: "false"

jobs:
  measure:
    name: Measure OpenClaw main RTT
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout RTT tracker
        uses: actions/checkout@v7
        with:
          path: openclaw-rtt
          fetch-depth: 0

      - name: Archive workflow scripts
        working-directory: openclaw-rtt
        shell: bash
        run: |
          set -euo pipefail
          scripts_archive_dir="$(mktemp -d "$RUNNER_TEMP/rtt-workflow-scripts.XXXXXX")"
          git archive "${{ github.workflow_sha }}" scripts | tar -x -C "$scripts_archive_dir"
          printf 'RTT_SCRIPTS_DIR=%s\n' "$scripts_archive_dir/scripts" >>"$GITHUB_ENV"

      - name: Checkout OpenClaw main
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: main
          path: openclaw
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Blacksmith Docker Builder
        uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2
        with:
          cache-key: openclaw-rtt-main-telegram

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          store_path="$(pnpm store path --silent)"
          test -n "$store_path"
          printf 'path=%s\n' "$store_path" >>"$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: openclaw-main-rtt-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openclaw/pnpm-lock.yaml') }}
          restore-keys: |
            openclaw-main-rtt-pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build OpenClaw package
        id: pack
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::pnpm install"
          time pnpm install --frozen-lockfile --prefer-offline --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true
          echo "::endgroup::"
          echo "::group::pnpm build"
          time pnpm build
          echo "::endgroup::"
          mkdir -p .artifacts/rtt-package
          echo "::group::package OpenClaw"
          time node scripts/package-openclaw-for-docker.mjs \
            --skip-build \
            --pnpm-pack \
            --allow-unreleased-changelog \
            --output-dir .artifacts/rtt-package
          echo "::endgroup::"
          package_tgz="$(find .artifacts/rtt-package -maxdepth 1 -name '*.tgz' -type f | sort | tail -1)"
          if [[ -z "$package_tgz" ]]; then
            echo "No package tgz produced." >&2
            exit 1
          fi
          package_version="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')+$(git rev-parse --short=10 HEAD)"
          echo "package_tgz=${PWD}/${package_tgz}" >>"$GITHUB_OUTPUT"
          echo "package_version=$package_version" >>"$GITHUB_OUTPUT"

      - name: Build OpenClaw QA harness
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          time OPENCLAW_BUILD_PRIVATE_QA=1 pnpm build

      - name: Run RTT
        id: rtt
        working-directory: openclaw
        env:
          OPENCLAW_QA_CREDENTIAL_SOURCE: convex
          OPENCLAW_QA_CREDENTIAL_ROLE: ci
          OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
          OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
          OPENCLAW_NPM_TELEGRAM_SKIP_HOTPATH: "1"
          INPUT_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.samples || '20' }}
        shell: bash
        run: |
          samples="${INPUT_SAMPLES:-20}"
          output="$RUNNER_TEMP/openclaw-rtt-runs/main"
          evidence_path="$output/raw/qa-evidence.json"
          metrics_path="$RUNNER_TEMP/openclaw-rtt-resource-metrics.env"
          status=0
          rtt_env=(
            OPENCLAW_NPM_TELEGRAM_PACKAGE_SPEC="openclaw@main"
            OPENCLAW_NPM_TELEGRAM_PACKAGE_TGZ="${{ steps.pack.outputs.package_tgz }}"
            OPENCLAW_NPM_TELEGRAM_OUTPUT_DIR="$output/raw"
            OPENCLAW_NPM_TELEGRAM_PROVIDER_MODE=mock-openai
            OPENCLAW_NPM_TELEGRAM_RTT_CHECKS=telegram-reply-chain-exact-marker
            OPENCLAW_NPM_TELEGRAM_RTT_SAMPLES="$samples"
            OPENCLAW_QA_TELEGRAM_SCENARIO_TIMEOUT_MS=240000
          )
          started_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          if ! [[ "$samples" =~ ^[1-9][0-9]*$ ]]; then
            echo "samples must be a positive integer, got: $samples" >&2
            status=2
          else
            set +e
            env \
              "${rtt_env[@]}" \
              /usr/bin/time \
              -f 'max_rss_kb=%M\nelapsed_seconds=%e' \
              -o "$metrics_path" \
              pnpm test:docker:npm-telegram-live
            status="$?"
            set -e
          fi
          finished_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          if [[ ! -f "$evidence_path" ]]; then
            echo "No qa-evidence.json produced." >&2
            if [[ "$status" -eq 0 ]]; then
              status=1
            fi
          fi
          {
            echo "status=$status"
            echo "evidence_path=$evidence_path"
            echo "resource_metrics_path=$metrics_path"
            echo "started_at=$started_at"
            echo "finished_at=$finished_at"
          } >>"$GITHUB_OUTPUT"

      - name: Verify OpenClaw checkout is clean
        if: always()
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "OpenClaw checkout was modified by the Telegram RTT harness." >&2
            exit 1
          fi

      - name: Upload Telegram RTT diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: main-telegram-rtt-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openclaw-rtt-runs/main
            ${{ runner.temp }}/openclaw-rtt-resource-metrics.env
          retention-days: 14
          if-no-files-found: warn

      - name: Fail when Telegram RTT producer fails
        if: steps.rtt.outputs.status != '0'
        shell: bash
        run: |
          echo "Telegram RTT producer failed with status ${{ steps.rtt.outputs.status }}." >&2
          exit 1

      - name: Import result
        if: steps.rtt.outputs.status == '0'
        working-directory: openclaw-rtt
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node "$RTT_SCRIPTS_DIR/import-result.mjs" "${{ steps.rtt.outputs.evidence_path }}" \
            --spec openclaw@main \
            --version "${{ steps.pack.outputs.package_version }}" \
            --scenario telegram-reply-chain-exact-marker \
            --started-at "${{ steps.rtt.outputs.started_at }}" \
            --finished-at "${{ steps.rtt.outputs.finished_at }}" \
            --resource-metrics "${{ steps.rtt.outputs.resource_metrics_path }}"
          node "$RTT_SCRIPTS_DIR/update-readme.mjs" --latest-main-only
          node "$RTT_SCRIPTS_DIR/validate.mjs"
          node "$RTT_SCRIPTS_DIR/summary.mjs"

      - name: Commit result
        if: steps.rtt.outputs.status == '0'
        working-directory: openclaw-rtt
        shell: bash
        run: |
          set -euo pipefail
          git add data/channels/telegram/ runs/telegram/ README.md
          if git diff --cached --quiet --exit-code; then
            echo "No RTT changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: record main rtt"
          git push || {
            # Drop only generated dashboard state so real data conflicts still fail the rebase.
            git restore --source=HEAD^ --staged --worktree README.md
            git commit --amend --no-edit
            git pull --rebase origin main
            if [[ "$(git rev-list --count "origin/main..HEAD")" == "0" ]]; then
              echo "Telegram RTT import is already present after rebase."
              exit 0
            fi
            node "$RTT_SCRIPTS_DIR/update-readme.mjs" --latest-main-only
            node "$RTT_SCRIPTS_DIR/validate.mjs"
            git add README.md
            git commit --amend --no-edit
            git push
          }
