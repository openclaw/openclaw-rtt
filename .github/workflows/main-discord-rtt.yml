name: Main Discord RTT

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: Number of Discord canary RTT samples
        required: false
        default: "20"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: main-discord-rtt-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26.12.1"
  PNPM_VERSION: "12.15.0"
  pnpm_config_pm_on_fail: "ignore"

jobs:
  measure:
    name: Measure OpenClaw main Discord RTT
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: qa-live-shared
    outputs:
      artifact_id: ${{ steps.upload_import.outputs.artifact-id }}
      version: ${{ steps.openclaw_ref.outputs.version }}
    steps:
      - name: Checkout RTT tracker
        uses: actions/checkout@v7
        with:
          path: openclaw-rtt
          fetch-depth: 0
          persist-credentials: false

      - name: Archive workflow scripts
        working-directory: openclaw-rtt
        shell: bash
        run: |
          set -euo pipefail
          scripts_archive_dir="$(mktemp -d "$RUNNER_TEMP/rtt-workflow-scripts.XXXXXX")"
          git archive "${{ github.workflow_sha }}" scripts | tar -x -C "$scripts_archive_dir"
          printf 'RTT_SCRIPTS_DIR=%s\n' "$scripts_archive_dir/scripts" >>"$GITHUB_ENV"

      - name: Checkout OpenClaw main
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: main
          path: openclaw
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: pnpm/setup@v3.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          store_path="$(pnpm store path --silent)"
          test -n "$store_path"
          printf 'path=%s\n' "$store_path" >>"$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: openclaw-main-discord-rtt-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openclaw/pnpm-lock.yaml') }}
          restore-keys: |
            openclaw-main-discord-rtt-pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install OpenClaw dependencies
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          time pnpm install --frozen-lockfile --prefer-offline --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Resolve OpenClaw ref
        id: openclaw_ref
        working-directory: openclaw
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          revision="$(git rev-parse --short=10 HEAD)"
          echo "version=${version}+${revision}" >>"$GITHUB_OUTPUT"

      - name: Build private QA runtime
        working-directory: openclaw
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"
        shell: bash
        run: |
          set -euo pipefail
          time pnpm build

      - name: Run Discord RTT samples
        id: discord_rtt
        working-directory: openclaw
        env:
          OPENCLAW_QA_CONVEX_SITE_URL: ${{ secrets.OPENCLAW_QA_CONVEX_SITE_URL }}
          OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
          OPENCLAW_QA_CREDENTIAL_ACQUIRE_TIMEOUT_MS: "180000"
          OPENCLAW_QA_CREDENTIAL_HTTP_TIMEOUT_MS: "60000"
          OPENCLAW_QA_REDACT_PUBLIC_METADATA: "1"
          INPUT_SAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.samples || '20' }}
        shell: bash
        run: |
          set -euo pipefail

          samples="${INPUT_SAMPLES:-20}"
          if ! [[ "$samples" =~ ^[1-9][0-9]*$ ]]; then
            echo "samples must be a positive integer, got: $samples" >&2
            exit 1
          fi

          output_root=".artifacts/qa-e2e/discord-rtt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sample_paths="$RUNNER_TEMP/openclaw-discord-rtt-samples.tsv"
          : >"$sample_paths"
          echo "output_root=${output_root}" >>"$GITHUB_OUTPUT"
          echo "sample_paths=${sample_paths}" >>"$GITHUB_OUTPUT"

          for sample in $(seq 1 "$samples"); do
            output_dir="${output_root}/sample-${sample}"
            summary_path="${output_dir}/qa-evidence.json"
            observed_path="${output_dir}/discord-qa-observed-messages.json"
            metrics_path="${output_dir}/resource-metrics.env"
            status=1
            for attempt in 1 2 3; do
              rm -rf "$output_dir"
              mkdir -p "$output_dir"
              set +e
              /usr/bin/time \
                -f 'max_rss_kb=%M\nelapsed_seconds=%e' \
                -o "$metrics_path" \
                pnpm openclaw qa discord \
                --repo-root . \
                --output-dir "${output_dir}" \
                --provider-mode mock-openai \
                --model mock-openai/gpt-5.5 \
                --alt-model mock-openai/gpt-5.5-alt \
                --fast \
                --credential-source convex \
                --credential-role ci \
                --scenario discord-canary
              status="$?"
              set -e
              {
                echo "sample=${sample}"
                echo "attempts=${attempt}"
                echo "exit_status=${status}"
              } >>"$metrics_path"
              if [[ -f "$summary_path" ]]; then
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 15))
              fi
            done
            if [[ ! -f "$summary_path" ]]; then
              echo "No Discord QA evidence produced for sample ${sample}." >&2
              if [[ "$status" -eq 0 ]]; then
                status=1
              fi
              exit "$status"
            fi
            observed_value=""
            if [[ -f "$observed_path" ]]; then
              observed_value="${PWD}/${observed_path}"
            fi
            printf '%s\t%s\t%s\n' "${PWD}/${summary_path}" "$observed_value" "${PWD}/${metrics_path}" >>"$sample_paths"
          done

      - name: Upload Discord RTT artifacts
        id: upload_import
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: main-discord-rtt-${{ github.run_id }}-${{ github.run_attempt }}
          path: openclaw/.artifacts/qa-e2e/discord-rtt-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn

  report:
    name: Import main Discord RTT report
    needs: measure
    if: github.ref == 'refs/heads/main' && needs.measure.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      group: rtt-report-writer-main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout RTT tracker
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Archive workflow scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts_archive_dir="$(mktemp -d "$RUNNER_TEMP/rtt-workflow-scripts.XXXXXX")"
          git archive "${{ github.workflow_sha }}" scripts | tar -x -C "$scripts_archive_dir"
          printf 'RTT_SCRIPTS_DIR=%s\n' "$scripts_archive_dir/scripts" >>"$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download exact RTT import artifact
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.measure.outputs.artifact_id }}
          path: ${{ runner.temp }}/rtt-import
          merge-multiple: true

      - name: Import Discord RTT result
        env:
          VERSION: ${{ needs.measure.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node "$RTT_SCRIPTS_DIR/publish-rtt-report.mjs" prepare
          sample_paths="$RUNNER_TEMP/discord-rtt-samples.tsv"
          : >"$sample_paths"
          while IFS= read -r sample_dir; do
            observed="${sample_dir}/discord-qa-observed-messages.json"
            [[ -f "$observed" ]] || observed=""
            printf '%s\t%s\t%s\n' "${sample_dir}/qa-evidence.json" "$observed" "${sample_dir}/resource-metrics.env" >>"$sample_paths"
          done < <(find "$RUNNER_TEMP/rtt-import" -mindepth 1 -maxdepth 1 -type d -name 'sample-*' | sort -V)
          node "$RTT_SCRIPTS_DIR/import-discord-rtt.mjs" "$sample_paths" \
            --spec openclaw@main --version "$VERSION" --provider-mode mock-openai
          node "$RTT_SCRIPTS_DIR/update-readme.mjs" --latest-main-only
          node "$RTT_SCRIPTS_DIR/validate.mjs"
          node "$RTT_SCRIPTS_DIR/discord-rtt-summary.mjs"

      - name: Commit result
        run: node "$RTT_SCRIPTS_DIR/publish-rtt-report.mjs" publish --family discord
